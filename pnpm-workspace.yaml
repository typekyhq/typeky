packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/themes/*'

# pnpm 10+ blocks dependency build scripts by default (supply-chain policy);
# they must be allowed explicitly. These two need to download and install their
# own binaries, otherwise neither `wrangler dev` nor `vitest` can start:
#   esbuild -- the bundler behind vitest / vite
#   workerd -- the local Workers runtime behind wrangler
# Note: pnpm 12 uses the `allowBuilds` map; older versions used the
# `onlyBuiltDependencies` array.
allowBuilds:
  esbuild: true
  workerd: true
