name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the exact version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Fails when the generated Drizzle schema or the DDL migration no longer
      # matches packages/core/src/model (architecture section 5.1).
      - name: Schema drift
        run: pnpm check:schema-drift

      # Asserts the site side stays free of frontend framework code and that the
      # site Worker never imports the editor package (CONTRIBUTING section 3).
      - name: Asset boundaries
        run: pnpm check:boundaries
